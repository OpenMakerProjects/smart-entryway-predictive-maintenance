<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660"><rect width="980" height="660" fill="#f7fafc"/><g font-family="sans-serif" font-size="17" fill="#172b3a"><text x="30" y="35">ID15: Nano 33 IoT maintenance monitor — USB 5V in; all I/O 3.3V</text><rect x="40" y="90" width="240" height="430" rx="10" fill="#dbeaf3" stroke="#172b3a"/><text x="60" y="120">Nano 33 IoT</text><text x="60" y="170">3V3</text><text x="60" y="240">D2 INPUT_PULLUP</text><text x="60" y="310">A0 ADC (10 bit)</text><text x="60" y="380">D5 R / D6 G / D9 B</text><text x="60" y="490">GND</text><g fill="none" stroke-width="3"><path d="M280 165H900" stroke="#d33"/><path d="M280 485H900" stroke="#222"/><path d="M280 235H400V255H520" stroke="#386"/><path d="M620 255H680V485" stroke="#222"/><path d="M780 165V210M780 265V310H280M780 310V350M780 405V485" stroke="#247"/><path d="M280 375H420M510 375H560M280 395H420M510 395H560M280 415H420M510 415H560M690 400H720V485" stroke="#754"/></g><text x="420" y="205">NC when door closed</text><rect x="520" y="235" width="100" height="40" fill="#fff" stroke="#222"/><text x="525" y="261">reed switch</text><rect x="752" y="210" width="56" height="55" fill="#fff" stroke="#222"/><text x="815" y="240">LDR</text><rect x="752" y="350" width="56" height="55" fill="#fff" stroke="#222"/><text x="815" y="380">10kΩ</text><text x="790" y="300">divider junction</text><rect x="420" y="357" width="90" height="68" fill="#fff" stroke="#222"/><text x="425" y="378">330Ω ×3</text><text x="425" y="415">R / G / B</text><rect x="560" y="357" width="130" height="68" fill="#fff" stroke="#222"/><text x="566" y="380">RGB anodes</text><text x="566" y="410">common K</text><text x="800" y="150">3.3V rail</text><text x="800" y="510">common GND</text><text x="30" y="570">Closed contact shorts D2 to GND; open contact reads HIGH through internal pull-up.</text><text x="30" y="603">Each RGB anode has its own resistor. Never connect 5V to GPIO or A0.</text></g></svg>